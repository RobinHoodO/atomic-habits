name: Deploy (Cloudflare)

# Push to main tests, builds with OpenNext and deploys the atomic-habits Worker.
# Pull requests only test and build. Requires repo secrets CLOUDFLARE_API_TOKEN
# and CLOUDFLARE_ACCOUNT_ID. Runtime secrets (DATABASE_URL etc.) live on the
# Worker itself, not in CI.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: cloudflare-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  cloudflare:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Build only (pull request)
        if: github.event_name == 'pull_request'
        run: npm run cf:build
      - name: Build and deploy (main)
        if: github.event_name == 'push'
        run: npm run cf:deploy
